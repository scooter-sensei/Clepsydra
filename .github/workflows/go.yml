name: go

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # stress, weekly
  workflow_dispatch:
    inputs:
      tier:
        description: "test.sh tier"
        default: stress

defaults:
  run:
    working-directory: go

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7" # verify/expected/ was produced with it
          cache-dependency-path: go/go.mod
      - run: ./test.sh sanity
      - run: ./test.sh regression
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: go/verify-report/

  tier:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # regression --full and stress replay old commits
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: go/go.mod
      - run: ./test.sh ${{ inputs.tier || 'stress' }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: go/verify-report/
