name: go

# Sanity and regression on every push and pull request. The stress tier, and
# any tier on request, run from tier.yml.
on:
  push:
  pull_request:

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3" # go.mod's toolchain; verify/expected/ (made with 1.24.7) is byte-identical under it
          cache-dependency-path: go/go.mod
      - run: ./test.sh sanity
      - run: ./test.sh regression
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: go/verify-report/
