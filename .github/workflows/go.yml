name: go

# Sanity and regression on every push and pull request. The stress tier, and
# any tier on request, run from tier.yml.
on:
  push:
  pull_request:

defaults:
  run:
    working-directory: go

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7" # verify/expected/ was produced with it
          cache-dependency-path: go/go.mod
      - run: ./test.sh sanity
      - run: ./test.sh regression
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: go/verify-report/
